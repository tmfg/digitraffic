name: Build and Validate

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Clean
        run: pnpm run clean

      - name: Build (TypeScript)
        run: pnpm run build

      - name: Install assets (icons, fonts, bundle)
        env:
          npm_config_script_shell: /bin/bash
        run: pnpm run install-all

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: pnpm run build:jekyll

      - name: Upload bundle artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: |
            js/bundle*.js*
            _scss/bundle.scss
          retention-days: 7

      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Build Status'
            echo ''
            case "$JOB_STATUS" in
              success)
                echo '✅ Build completed successfully'
                ;;
              failure)
                echo '❌ Build failed'
                ;;
              cancelled)
                echo '⚠️ Build was cancelled'
                ;;
              *)
                echo "Build status: $JOB_STATUS"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: failure()
        uses: tmfg/digitraffic-actions@4cdf78c4e7d654eaa1d8a6677bb7ea00d1bf1ca9 # slack-notify/v1
        with:
          status: failure
          fields: repo, job, took
          text: "Build failed"
          webhook-url: ${{ secrets.SLACK_ALARMS_WEBHOOK_URL }}

