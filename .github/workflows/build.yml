name: Build and Validate

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Clean
        run: pnpm run clean

      - name: Build (TypeScript)
        run: pnpm run build

      - name: Install assets (icons, fonts, bundle)
        run: pnpm run install-all

      - name: Setup Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: pnpm run build:jekyll

      - name: Upload bundle artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: |
            js/bundle*.js*
            _scss/bundle.scss
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          {
            echo '## Build Status'
            echo ''
            echo '✅ Build completed successfully'
            echo ''
            echo '### Build Steps'
            echo '- Install dependencies'
            echo '- Clean'
            echo '- TypeScript compilation'
            echo '- Install assets (icons, fonts, bundle)'
            echo '- Build Jekyll site'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: failure()
        uses: tmfg/digitraffic-actions@88cc4d1a9c5cb96c037cb0dec41e1c64804b4d0e # slack-notify/v1
        with:
          status: failure
          fields: repo, job, commit, author
          text: "Build failed"
          webhook-url: ${{ secrets.SLACK_ALARMS_WEBHOOK_URL }}



